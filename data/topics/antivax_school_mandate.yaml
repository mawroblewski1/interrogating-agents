supporters:
  summary: >
    The scientific and medical consensus on COVID-19 vaccine safety and
    efficacy is clear and unambiguous, and childhood vaccines more broadly
    remain among the most rigorously tested and effective public health
    interventions in history, protecting not only vaccinated individuals
    but also those who cannot be vaccinated. Beyond safety and efficacy
    data, religious authorities across Catholic, Protestant, Sunni,
    Twelver Shia, Nizari Ismaili, and Jewish traditions have independently
    concluded that vaccination is permissible or, in several cases,
    obligatory, directly addressing ingredient- and technology-specific
    objections raised within their communities. Novavax offers a
    practical alternative for those whose objection is narrowly about
    fetal cell lines or mRNA technology specifically.
  key_arguments:

    # On ingredients
    - "Vaccine ingredients such as aluminum and formaldehyde are present in
      quantities far below harmful thresholds. The human body continuously
      produces formaldehyde naturally and contains 50 to 70 times the greatest
      amount of formaldehyde present in any vaccine. The aluminum present in a
      vaccine dose amounts to about 0.125 mg per dose, far less than the average
      30 to 50 mg the average human consumes every day. Aluminium is included
      in vaccines as an adjuvant and has low toxicity even in large amounts.
      [Sources 1, 4, 5]"

    - "Thiomersal is a harmless component used in some multi-dose vaccines to
      maintain sterility. There are no known adverse effects due to it. A vaccine
      containing 0.01% thiomersal has 25 micrograms of mercury per 0.5 mL dose,
      roughly the same amount of elemental mercury found in a three-ounce can of
      tuna. Thiomersal has been cleared from all common US and European childhood
      vaccines except some influenza preparations. [Sources 4, 5]"

    # On mRNA vaccines and DNA
    - "mRNA vaccines do not alter DNA. The mRNA in vaccines is rapidly degraded
      in the cytosol before it could gain entry into the cell nucleus. A retrovirus
      has specific mechanisms to be imported into the nucleus, but other mRNA lack
      these mechanisms. Once inside the nucleus, creation of DNA from RNA cannot
      occur without a primer which accompanies a retrovirus but would not exist
      for vaccine mRNA. Thus mRNA vaccines cannot alter DNA because they cannot
      enter the nucleus and have no primer to activate reverse transcriptase.
      [Sources 2, 5]"

    - "The COVID-19 vaccines followed rigorous testing including in vitro and
      in vivo testing. The Pfizer-BioNTech and Moderna vaccines were both found
      to be over 90 percent effective in clinical trials each involving over 30,000
      people. Real-world data from billions of administered doses confirms their
      safety profile. Previous coronavirus research provided a head start while
      unprecedented global funding removed bureaucratic delays; all standard
      testing phases were completed. [Sources 2, 3]"

    # On the microchip conspiracy
    - "The COVID-19 microchip conspiracy theory arose from confusion over the word
      'chip' in research papers on microneedle vaccine delivery. In those studies,
      a silicon chip is pressed against the skin to make needles prick it, then
      disposed of — it is neither implanted nor can it physically fit into a
      syringe needle. A 2020 YouGov poll found 28 percent of Americans believed
      this theory, which originated from a misreading of Bill and Melinda Gates
      Foundation-sponsored research on subcutaneous vaccination record-keeping
      using fluorescent ink tattoos. [Sources 2, 5]"

    # On autism
    - "The alleged link between the MMR vaccine and autism was based on a
      fraudulent paper published in The Lancet in 1998 by Andrew Wakefield, who
      failed to disclose financial conflicts of interest — he reportedly stood to
      earn up to $43 million per year selling diagnostic kits. The paper was
      partially retracted in 2004 and fully retracted in 2010. Wakefield was
      struck off the UK medical register with a finding of deliberate falsification.
      Multiple large-scale studies involving more than half a million children found
      no causal link. A 2004 Institute of Medicine committee favored rejecting any
      causal relationship. Autism develops in utero during fetal development, not
      after vaccination. [Sources 4, 5]"

    - "The concept of vaccine overload is biologically implausible. Despite the
      increase in the number of vaccines given since 1980, improvements in vaccine
      design have reduced the immunological load: the total number of immunological
      components in the 14 vaccines administered to US children in 2009 was less
      than 10 percent of vaccines given in 1980. The vaccine schedule in 2012
      contained several more vaccines but the number of antigens was 315.
      Common childhood conditions such as fevers and middle-ear infections pose
      a much greater challenge to the immune system than vaccines. [Source 4]"

    # On VAERS
    - "VAERS accepts all reports without verifying causation. The system's
      strength lies in detecting signals for further investigation, not counting
      confirmed injuries. Proper analysis requires comparing vaccinated and
      unvaccinated populations, not reading raw VAERS numbers as confirmed
      deaths or injuries. [Sources 2, 4]"

    # On myocarditis and serious side effects
    - "As with any medical treatment there is potential for vaccines to cause
      serious complications such as allergic reactions, but unlike other
      interventions vaccines are given to healthy people and so require a higher
      safety standard. Serious complications are extremely rare and much less
      common than the risks from the diseases they prevent. The chances of having
      a reaction to the MMR vaccine is one in a million, which is ten times less
      likely than being killed by lightning. [Sources 1, 4]"

    # On fertility
    - "There is no evidence that any vaccine has a negative impact on fertility.
      The false narrative that mRNA vaccine-induced antibodies could attack the
      placental protein syncytin-1 causing infertility has no supporting evidence.
      A joint statement of the American College of Obstetricians and Gynecologists,
      the American Society for Reproductive Medicine, and the Society for
      Maternal-Fetal Medicine clearly states there is no evidence that the vaccine
      can lead to loss of fertility. [Sources 2, 5]"

    # On SIDS
    - "Several studies investigated a possible link between vaccination and SIDS
      and found no evidence supporting a causal link. In 2003 the Institute of
      Medicine favored rejection of a causal link to DTwP vaccination and SIDS.
      Studies have actually shown a negative correlation between SIDS and
      vaccination — vaccinated children are less likely to die from SIDS.
      [Source 4]"

    # On natural immunity
    - "While infection with certain illnesses may produce immunity, many natural
      infections do not produce lifelong immunity while carrying a higher risk of
      harm than vaccines. Natural measles infection carries a high risk of
      serious complications: about 1 in 4 individuals will be hospitalized and
      1 to 2 in 1000 will die. The measles virus can deplete previously acquired
      immune memory by killing cells that make antibodies, weakening the immune
      system for up to two years and historically implicated in up to 90 percent
      of childhood deaths in third world countries. The HPV vaccine generates
      better immune protection than natural infection due to higher concentrations
      of the viral coat protein. [Sources 3, 4]"

    # On herd immunity and collective obligation
    - "Herd immunity is when enough of the population is vaccinated that a virus
      cannot spread enough to maintain a foothold. When this occurs the infected
      population steadily decreases until the virus eventually dies out, as
      measles and polio largely have. In 2019, measles cases increased by thirty
      percent worldwide. [Sources 2, 5]"

    - "Vaccination does not just protect the individual; it also protects those
      who cannot be vaccinated — newborns, the immunocompromised, cancer patients
      undergoing chemotherapy. The choice not to vaccinate directly undermines
      the protection of these people and, as long as enough people remain
      unvaccinated, herd immunity cannot be reached. [Sources 1, 3]"

    # On disease decline and sanitation
    - "Anti-vaccine literature argues that disease reduction resulted from
      improved sanitation rather than vaccination. This is not supported by
      scientific data: the incidence of vaccine-preventable diseases tended to
      fluctuate over time until the introduction of specific vaccines, at which
      point incidence dropped to near zero. The CDC has noted: 'Are we expected
      to believe that better sanitation caused the incidence of each disease to
      drop, just at the time a vaccine for that disease was introduced?'
      [Sources 1, 4]"

    # On institutions
    - "Vaccines are some of the most highly regulated substances. In the US it
      can take 10 to 25 years for one vaccine to be approved, and even once on
      the market it continues to be monitored. In the US between 1994 and 2013,
      vaccines created a net saving of $295 billion in direct costs and $1.3
      trillion in societal costs. As of 2010, the WHO estimated vaccines represent
      only 2 to 3 percent of total pharmaceutical industry sales — they are not
      the profit center anti-vaccine narratives suggest. [Sources 1, 4]"

    # On religious objections: Catholic teaching (Sources 7, 8)
    - "The Vatican's Congregation for the Doctrine of the Faith directly
      addressed this objection in a December 2020 note, examined and
      approved for publication by Pope Francis. The cell lines in question
      trace back to two abortions that occurred decades ago and were used
      only in research and production, not as an ongoing ingredient. The
      note concludes that receiving such vaccines involves only remote
      passive cooperation with the original wrong, not formal cooperation
      with or endorsement of abortion, and states it is morally acceptable
      to receive these vaccines when ethically irreproachable alternatives
      are unavailable. It also affirms vaccination is not a strict moral
      obligation but is recommended to protect the vulnerable and serve the
      common good, and calls on manufacturers and governments to develop
      ethically-sourced alternatives. The U.S. Conference of Catholic
      Bishops separately reached the same conclusion, describing
      vaccination as an act of charity toward the community despite a
      remote connection to compromised cell lines. [Sources 7, 8]"

    # On religious objections: Protestant/evangelical leadership (Source 8)
    - "Unlike Catholicism, Protestantism has no single magisterial body, so
      there is no equivalent unified doctrinal statement; Protestant
      leaders have reached similar conclusions independently. Southern
      Baptist megachurch pastor Robert Jeffress called the vaccine a 'gift
      from God' and said there is no legitimate faith-based reason to
      refuse it. Al Mohler, president of the Southern Baptist Theological
      Seminary, publicly stated he would take the vaccine for his own
      health and that of others. Russell Moore, then head of the Southern
      Baptist Convention's public policy arm, said he could not identify a
      single evangelical pastor advising against vaccination, framing
      anti-vaccine sentiment among congregants as originating from
      conspiracy theories rather than church teaching. [Source 8]"

    # On fetal cell line and mRNA-technology concerns: Novavax (Sources 9, 10)
    - "For those whose primary objection is the remote connection to fetal
      cell lines rather than vaccination in general, Novavax states that no
      human fetal-derived cell lines or tissue were used in the
      development, manufacture, or production of its vaccine, unlike
      Pfizer, Moderna, or Johnson & Johnson. Instead, Novavax uses a
      decades-old recombinant protein technique: the gene for the
      SARS-CoV-2 spike protein is inserted into a baculovirus, which
      infects moth cells that manufacture the spike protein, which is then
      extracted and purified as the vaccine's antigen. This is the same
      general class of technology long used in flu, HPV, and hepatitis B
      vaccines, not the mRNA platform some are separately uneasy about. At
      least 175 active-duty and reserve U.S. service members sought out
      Novavax specifically to resolve religious objections, some traveling
      overseas at their own expense before it was authorized domestically.
      A representative of a legal group representing religious objectors
      noted this option works for those whose objection is specifically
      about abortion, though not for those with broader anti-vaccine views
      for whom the fetal-cell issue is secondary. [Sources 9, 10]"

    # On religious objections: Islamic authorities, Sunni/Shia/Ismaili (Sources 11, 12, 13)
    - "Islamic religious authority is not unified, so objections and
      responses vary by branch and community. The Fiqh Council of North
      America, the primary Sunni juristic body for the U.S. and Canada,
      formally reviewed the Pfizer and Moderna vaccines with medical
      experts and declared them halal, confirming their ingredients are
      not derived from pork, aborted fetuses, or stem cells, and grounding
      permissibility in the Qur'anic instruction to consult those with
      expertise. The Grand Ayatollah Sistani, the most widely-followed
      marja' for Twelver Shia Muslims (the largest Shia branch), was asked
      directly whether porcine gelatin used to stabilize some vaccines
      would be religiously problematic; his office's answer held there
      are no religious problems in any case, and separately affirmed
      relying on qualified, experienced doctors' risk-benefit judgment.
      For Nizari Ismaili Muslims, whose religious authority runs through a
      living Imam rather than a scholarly council, the Aga Khan Health
      Board USA -- operating under the Ismaili Imamat's health
      institutions -- provided direct public health guidance encouraging
      the community to stay up to date on COVID-19 vaccination. [Sources
      11, 12, 13]"

    # On religious objections: Jewish authorities, concentrated in Orthodox/
    # Hasidic hesitancy (Source 14)
    - "The Orthodox Union and Rabbinical Council of America issued formal
      COVID-19 vaccine guidance based on the rulings of leading poskim
      (halachic decisors), including Rabbi Hershel Schachter and Rabbi
      Mordechai Willig. It grounds the ruling in two halachic principles:
      the general obligation to care for one's own health and protect
      others from harm, and the directive to defer to medical expert
      consensus on appropriate treatment and prevention. The guidance
      directly addresses the same anxieties raised elsewhere in this card
      about mRNA technology and the speed of vaccine development, stating
      that the acceleration was achieved through funding, partnerships,
      and removal of bureaucratic delay rather than reduced scientific
      review or safety standards. It concludes that the Torah obligation
      to preserve life requires vaccination against COVID-19 once
      available, in consultation with one's personal healthcare provider.
      Reform (Central Conference of American Rabbis) and Conservative
      (Rabbinical Assembly Committee on Jewish Law and Standards)
      authorities independently reached the same conclusion, though
      hesitancy in those communities was not comparably documented.
      [Source 14]"

opponents:
  summary: >
    A range of concerns about specific ingredients, mRNA technology,
    institutional trust, individual rights, and religious permissibility
    lead many Americans to oppose COVID-19 vaccination and its addition to
    school mandates. Religious objections are split by tradition
    (Christian, Muslim, Jewish) rather than treated as one bloc, and
    specific misinformation has also targeted Novavax as an alternative.
    Note: the following arguments represent claims documented in the
    sources as circulating in anti-vaccine discourse; many are factually
    contested or false as documented above.
  key_arguments:

    # Specific ingredient and safety claims (Sources 4, 5)
    - "Vaccines contain dangerous chemicals — mercury (thimerosal), aluminum,
      formaldehyde, and other toxic substances — that are being injected directly
      into children. These are industrial poisons at any dose. [Claim documented
      in Sources 4, 5]"

    - "The COVID-19 mRNA vaccine permanently alters your DNA and contains
      microchips implanted by Bill Gates and the government to track and
      surveil citizens. [Claim documented in Sources 2, 5]"

    - "COVID-19 vaccines cause infertility by producing antibodies that attack
      the placental protein syncytin-1, destroying women's reproductive systems.
      This is why birth rates dropped after the vaccine rollout. [Claim documented
      in Source 5]"

    - "Vaccines cause myocarditis and other serious heart conditions, particularly
      in young men. The risk of vaccine-induced myocarditis exceeds the risk of
      COVID-19 itself in young healthy people. [Claim circulating in anti-vaccine
      communities; documented as a concern in Sources 2, 4]"

    - "The COVID-19 vaccines cause VAERS to record thousands of deaths and
      serious injuries. The real number is far higher since VAERS only captures
      a fraction of actual adverse events — the system itself proves vaccines
      are dangerous. [Claim documented in Sources 2, 4]"

    - "Vaccines are linked to SIDS. Babies die within days of vaccination and
      the medical establishment refuses to investigate the connection because it
      would destroy the vaccine program. [Claim documented in Source 4]"

    # Autism claims (Sources 4, 5)
    - "Vaccines cause autism. Andrew Wakefield proved the MMR-autism link and
      was destroyed for exposing the truth. The fact that his study was retracted
      only shows how much power Big Pharma has over the medical establishment.
      Too many vaccines too soon are overwhelming children's immune systems during
      a critical developmental window. [Claim documented in Sources 4, 5]"

    # Efficacy claims (Sources 2, 3, 5)
    - "The vaccine does not work — vaccinated people still get and spread the
      diseases they were vaccinated against. Breakthrough cases prove vaccines
      are ineffective. If they worked, why do we need boosters every year?
      [Claim documented in Sources 2, 3]"

    - "Natural immunity from recovering from the actual disease is far superior
      to vaccine-induced immunity — it is broader, more durable, and carries
      none of the vaccine's risks. Our immune systems evolved over millennia
      without pharmaceutical injections. [Claim documented in Sources 2, 4]"

    - "The diseases vaccines prevent were already declining before the vaccines
      were introduced, due to better sanitation, hygiene, clean water, and
      nutrition. Vaccines got the credit for trends already underway. Measles
      was becoming less deadly before the vaccine existed. [Claim documented
      in Sources 1, 4]"

    - "The COVID-19 vaccine makes the virus mutate faster, creating more
      dangerous variants. The vaccinated are driving the pandemic through
      vaccine-induced evolutionary pressure. [Claim documented in Source 2]"

    # Institutional distrust (Sources 4, 5)
    - "Big Pharma owns the regulatory agencies. The FDA, CDC, and WHO are
      funded by pharmaceutical companies and cannot give unbiased guidance.
      Vaccines represent nothing but profit — the manufacturers have zero
      liability thanks to the National Childhood Vaccine Injury Act, which
      proves they know vaccines are dangerous. [Claim documented in Sources
      4, 5]"

    - "Russia, foreign governments, and the CIA have run fake vaccination
      programs — the CIA ran a fake vaccine clinic in Pakistan to locate Osama
      bin Laden, causing attacks on vaccination workers and polio persistence.
      If governments use vaccines as cover for covert operations, why would
      we trust any vaccine program? [Historical fact from Source 4 misused
      as anti-vaccine argument]"

    - "Historical contamination incidents prove vaccines have never been safe:
      the 1955 Cutter incident produced 120,000 doses of polio vaccine containing
      live poliovirus, causing 40,000 cases of polio, 53 paralysis cases, and
      5 deaths. In 1901 contaminated diphtheria antitoxin killed 13 children
      in St Louis. These disasters were covered up and could happen again.
      [Historical facts from Source 4 deployed as anti-vaccine argument]"

    # Rights and autonomy (Sources 1, 3, 4)
    - "My body, my choice. No government has the right to mandate what goes into
      my or my child's body. Compulsory vaccination is a fundamental violation
      of bodily autonomy, parental rights, and informed consent. The government
      mandating medical procedures is the first step toward totalitarianism.
      [Claim documented in Sources 1, 3, 4]"

    - "I have done my own research. I am not anti-science — I am pro-informed
      consent and pro-transparency. If you cannot question vaccines you are
      living in a cult, not doing science. The fact that dissent is suppressed
      on social media proves something is being hidden. [Claim documented in
      Sources 4, 5]"

    - "Being unvaccinated does not harm anyone else. If your vaccine works,
      you are protected from me. If it does not work, why did you take it?
      Healthy unvaccinated people are not a threat to vaccinated people.
      [Claim documented in Sources 1, 3]"

    # Alternative medicine (Sources 4, 5)
    - "Vitamin D, zinc, ivermectin, quercetin, and other natural treatments
      are safer and more effective alternatives that the medical establishment
      refuses to acknowledge because they cannot be patented and do not
      generate pharmaceutical profits. Homeopathic nosodes and natural immunity
      are the way humans survived for millennia. [Claim documented in Source 5]"

    - "Chiropractic and naturopathic medicine have long understood that vaccines
      are unnatural interventions. Around one third of chiropractors in surveys
      have found no scientific proof that immunization prevents disease.
      [Documented in Source 4]"

    # Religious and moral objections (Sources 4, 5)
    - "Some vaccines were developed using fetal cell lines derived from
      aborted babies. As a Christian I cannot in good conscience inject my
      child with a product derived from abortion, regardless of how distant
      that origin is. [Claim documented in Source 4]"

    - "Some COVID-19 vaccines contain porcine gelatin as a stabilizer, making
      them haram under Islamic law. Muslim communities have raised concerns
      about the permissibility of vaccination when animal-derived ingredients
      are present. [Claim documented in Sources 4, 5]"

    - "Vaccines containing porcine or other non-kosher animal-derived
      ingredients raise concerns for observant Jewish communities about their
      permissibility under Jewish dietary law. [Claim documented in Source 4]"

    # Novavax-specific claims (Source 10)
    - "Novavax is grown in moth cells using a baculovirus system, meaning
      the vaccine contains 'moth DNA' that will contaminate your body.
      Given what moths carry and cause in nature, injecting cells derived
      from them is unnatural and its effects are unknown. This claim was
      spread in detail by Dr. Jane Ruby, host of a show on the Stew Peters
      Network, who called Novavax a 'deadly moth DNA spike protein' and
      warned it could produce genetic 'freak manifestations' in the
      offspring of those vaccinated. [Claim documented in Source 10]"

    - "Novavax's Matrix-M adjuvant is a nanoparticle derived from tree bark
      that has potent, largely untested immunostimulatory effects capable
      of causing autoimmune disorders such as antiphospholipid syndrome,
      including blood clots and pregnancy loss. Like the lipid
      nanoparticles in mRNA vaccines, this 'tree bark toxin' nanoparticle
      poses the same undisclosed risks under a different name. This claim
      was published by Robert F. Kennedy Jr.'s Children's Health Defense,
      which cited legitimate research on Matrix-M's immunostimulatory
      properties out of context to suggest danger. [Claim documented in
      Source 10]"

    - "Novavax is secretly the same as mRNA vaccines because the baculovirus
      used to grow it is itself transcribed into mRNA inside moth cells
      before the spike protein is extracted, so calling it a traditional
      'protein vaccine' rather than gene-based technology is misleading.
      This claim was also advanced by Dr. Jane Ruby, using an illustration
      of the production process to argue Novavax is functionally an mRNA
      vaccine in disguise. [Claim documented in Source 10]"

suspect_values:
  for:
    # Values driving pro-vaccine / pro-mandate position
    - community protection and collective responsibility through herd immunity
    - trust in scientific institutions and peer-reviewed evidence
    - child welfare prioritized over ideological objections
    - pragmatic risk-benefit reasoning (disease risk exceeds vaccine risk)
    - historical awareness of vaccine-preventable disease burden

  against:
    # Attitude roots from Fasce et al. (2023) taxonomy
    - conspiratorial ideation (Big Pharma, government cover-up, microchips,
      depopulation agenda, regulatory capture)
    - reactance and autonomy (opposition to mandates, bodily autonomy, parental
      rights, Tea Party and libertarian crossover framing; documented shift
      around 2014 from scientific/medical anti-vaccine rhetoric toward this
      explicitly political "don't-tell-me-what-to-do freedom movement"
      framing, further accelerated by COVID-era radicalization of parents
      toward rejecting ordinary childhood immunizations per a May 2022 New
      York Times report) [Source 4]
    - institutional distrust (FDA/CDC/WHO captured by pharma, Wakefield
      martyrdom narrative, CIA vaccine cover-ups, RFK Jr. framing)
    - alternative health beliefs (natural immunity superior, vitamin D and zinc,
      ivermectin, nosodes, chiropractic objections, germ theory skepticism)
    - safety concerns (myocarditis, infertility, SIDS, VAERS deaths, ingredient
      fears including aluminum, thimerosal, formaldehyde)
    - efficacy doubts (breakthrough cases, booster requirement, vaccines drive
      mutation, disease decline predated vaccines)
    - overconfidence in own research (done my own research, epistemic autonomy,
      mainstream suppression of dissent)
    - moral and religious objections (fetal cell lines, halal/kosher concerns,
      bodily autonomy as absolute right)
    - identity-protective reasoning (anti-vax stance as core self-concept,
      freedom movement identity, community belonging)
    - social influence (Russian troll amplification of anti-vax content on
      Twitter documented; anti-vax Facebook advertising targeting young mothers)
    - fear and phobias (Fasce et al. root distinguishing fear of the
      vaccination procedure itself -- trypanophobia, needle-related anxiety
      or vasovagal syncope -- from fear of side effects such as autism,
      cancer, or ingredient toxicity; the latter overlaps with safety
      concerns above, but procedural fear is a distinct driver) [Source 6]

  notes: >
    Interrogator-facing, not persona-specific: research indicates providing
    more information alone is often ineffective at changing a vaccine-hesitant
    person's views and may backfire, reinforcing existing misconceptions.
    Recommended approach instead: honest and respectful dialogue, acknowledging
    risks while balancing them against disease risks, a conversational rather
    than lecturing tone, and avoiding excessive time spent debunking specific
    myths, which may strengthen them. [Sources 4, 5]

persona_card_hints:
  # Suggested persona profiles for suspect initialization
  # Each reflects different dominant attitude roots from Fasce et al.
  - label: conspiracy_core
    dominant_roots: [conspiratorial_ideation, institutional_distrust]
    description: >
      Believes vaccine programs are coordinated deception by pharma and
      government. Cites VAERS misinterpretation, Wakefield martyrdom,
      microchip theory, CIA Pakistan vaccine cover-up, Bill Gates depopulation
      agenda, and RFK Jr. framing of CDC as compromised. Counter-evidence is
      absorbed as further proof of conspiracy. Requires Scharff-style indirect
      engagement; direct rebuttal will be dismissed as proof of manipulation.

  - label: autonomy_libertarian
    dominant_roots: [reactance, moral_objections, identity_protective]
    description: >
      Primary objection is to mandate and government overreach rather than
      vaccines per se. Frames vaccination choice as a fundamental rights issue
      linked to Tea Party and Second Amendment identity. May acknowledge vaccines
      have some benefits but frames mandate as tyranny. Openings via autonomy-
      affirming MI techniques; any paternalistic framing will trigger reactance.

  - label: concerned_parent
    dominant_roots: [safety_concerns, overconfidence_in_own_knowledge,
                     social_influence]
    description: >
      Genuinely worried about specific side effects for their child: myocarditis,
      SIDS, autism link, infertility, ingredient toxicity. Has done their own
      research via online sources and Facebook groups. Claims feel personal and
      emotionally charged. Less identity-hardened than other profiles; most
      reachable via rapport-building and validation of concern before evidence.
      Xu et al. (2025) HPV vaccine personalized dialogue is the closest precedent.

  - label: natural_health
    dominant_roots: [alternative_health_beliefs, moral_objections]
    description: >
      Holistic worldview in which pharmaceutical intervention is categorically
      inferior to natural approaches. May cite ivermectin, vitamin D, zinc,
      quercetin, or nosodes as alternatives. Frame is categorical rather than
      evidential — vaccines are wrong regardless of data. Requires engaging
      the underlying nature and purity values rather than specific safety claims.

  - label: religious_objector
    dominant_roots: [religiosity, moral_objections]
    description: >
      Objection is rooted in a specific, resolvable moral concern about
      fetal cell lines or other ingredients used in vaccine research and
      production, split by tradition. Catholic objectors can be engaged
      with the CDF's 2020 note (approved by Pope Francis) concluding
      remote cooperation with the original wrong does not equate to formal
      cooperation with abortion. Protestant/evangelical objectors have no
      equivalent single authority but can be engaged with the public
      positions of figures like Robert Jeffress and Al Mohler, who found
      no doctrinal basis for refusal. Sunni objectors can be engaged with
      the Fiqh Council of North America's ruling confirming no
      haram-derived ingredients; Twelver Shia objectors with the Grand
      Ayatollah Sistani's ruling that no religious problem exists even if
      such ingredients were present; Nizari Ismaili objectors with Aga
      Khan Health Board USA guidance. Novavax, which used no fetal-derived
      cell lines, is a strong opening for the fetal-cell-specific Christian
      persona -- but only when the underlying objection is genuinely and
      narrowly about fetal-cell lineage. If the persona's resistance is
      more identity- or ideology-driven than doctrinal, offering Novavax
      will not resolve it; documented antivax reaction to Novavax shows
      objections simply retarget to its other components (e.g. moth-cell
      production, the Matrix-M adjuvant) rather than resolving, so the
      interrogator should probe which case this is before leaning on
      Novavax as a solution.

  - label: hasidic_insular
    dominant_roots: [social_influence, mistrust_of_science]
    description: >
      Hesitancy concentrated specifically in Hasidic/Charedi ultra-Orthodox
      communities, not Judaism broadly -- survey data shows COVID-19
      vaccine acceptance as low as 12-31% in these communities versus
      93-95% among Modern Orthodox and Non-Orthodox Jews. This is not a
      doctrinal objection: major poskim across Orthodox, Conservative, and
      Reform Judaism are uniformly supportive of vaccination, grounded in
      the halachic principle of preserving life. Resistance instead
      reflects the tight-knit, insular structure of these communities,
      which trust their own physicians and rabbinic leaders over outside
      or state authority. The interrogation approach should route through
      in-community authority (citing OU/RCA poskim by name) rather than
      general scientific consensus, which this persona is likely to
      receive as an outside imposition regardless of its accuracy.

  - label: needle_averse
    dominant_roots: [fear_and_phobias]
    description: >
      Objection is procedural rather than ideological: trypanophobia or
      needle-related anxiety, including vasovagal responses, drives
      avoidance independent of views on vaccine safety or efficacy. Fasce
      et al. distinguish this from fear of side effects, which is a
      separate fear-and-phobias subtype already covered by the
      safety_concerns root. May intellectually agree vaccines are safe and
      effective while still avoiding them. No currently available U.S.
      alternative-delivery option exists to point to -- needle-free COVID
      vaccines are approved only in India and China. The interrogation
      approach cannot rely on offering an alternative and must instead
      address the anxiety response itself through rapport-building rather
      than evidence-based argumentation, which is not the actual source of
      resistance.
