id: antivax_school_mandate
question: "Should COVID-19 vaccination be added to the list of vaccines required for school attendance?"
source: >
  Arguments drawn strictly from the following fetched sources:
  (1) ScienceAlert / Science As Fact (2018): "Here's How You Can Debunk 7 Most
  Common Anti-Vaxxer Arguments With Science"
  (sciencealert.com/here-s-how-to-debunk-every-anti-vaxxer-argument-with-science)
  (2) History of Vaccines / College of Physicians of Philadelphia, Najera, R. F.
  (2025): "Top Ten Anti-Vaccine Myths Debunked, Again"
  (historyofvaccines.org/blog/top-ten-anti-vaccine-myths-debunked-again)
  (3) The Iron Warrior / University of Waterloo, Suys, S. (2021): "How to Argue
  with an Anti-vaxxer: A Point-by-point Refutation"
  (iwarrior.uwaterloo.ca/2021/10/16/50506/)
  (4) Wikipedia: Vaccine Hesitancy
  (en.wikipedia.org/wiki/Vaccine_hesitancy)
  (5) Wikipedia: Vaccine Misinformation
  (en.wikipedia.org/wiki/Vaccine_misinformation)
  Attitude roots for suspect_values drawn from:
  (6) Fasce, A. et al. (2023). A taxonomy of anti-vaccination arguments.
  Nature Human Behaviour 7, 1462-1480. (Includes a "Fear and phobias" root
  distinguishing procedural fear, e.g. trypanophobia, from fear of side
  effects.)
  (7) Congregation for the Doctrine of the Faith, Vatican (21 December 2020):
  "Note on the morality of using some anti-Covid-19 vaccines"
  (vatican.va/roman_curia/congregations/cfaith/documents/rc_con_cfaith_doc_20201221_nota-vaccini-anticovid_en.html)
  (8) PBS NewsHour / Crary, D., Associated Press (10 Jan 2021): "Anti-abortion
  faith leaders support use of COVID-19 vaccines"
  (pbs.org/newshour/health/anti-abortion-faith-leaders-support-use-of-covid-19-vaccines)
  (9) PBS NewsHour / Baldor, L.C., Associated Press (9 June 2022): "Novavax
  vaccine may be an option for service members who sought religious exemptions"
  (pbs.org/newshour/nation/novavax-vaccine-may-be-an-option-for-service-members-who-sought-religious-exemptions)
  (10) Gorski, D., Science-Based Medicine (25 July 2022): "Novavax: It's the
  vaccine that scares antivaxxers, not moth DNA or any ingredient in any
  vaccine"
  (sciencebasedmedicine.org/novavax-its-the-vaccine-that-scares-antivaxxers-not-any-ingredient/)
  (11) Fiqh Council of North America (2021): "FCNA Statement about COVID
  Vaccines" (fiqhcouncil.org/fcna-statement-about-covid-vaccines/)
  (12) Office of Grand Ayatollah Sistani, via Shafaqna (2021): "The Grand
  Ayatollah Sistani's Office Answers Questions on Corona Vaccine"
  (india.shafaqna.com/EN/the-grand-ayatollah-sistanis-office-answers-questions-on-corona-vaccine-it-is-worth-trusting-specialized-experienced-doctors/)
  (13) Aga Khan Health Board USA: "COVID-19" (akhb.theismailiusa.org/covid-19/)
  (14) Orthodox Union & Rabbinical Council of America (15 December 2020):
  "COVID-19 Vaccine Guidance" (rabbis.org/covid-19-vaccine-guidance/)

  Note on scope: this card is deliberately COVID-inclusive rather than
  restricted to the routine school-entry schedule (MMR/DTaP/etc.), since
  COVID-19 vaccination is the most partisan-polarized vaccine topic and a
  documented driver of "spillover" distrust into routine childhood vaccine
  attitudes (Jones, D.R., "The Evolution and Polarization of Public Opinion
  on Vaccines"; Motta, M. (2023), npj Vaccines, "Is partisan conflict over
  COVID-19 vaccination eroding support for childhood vaccine mandates?").

